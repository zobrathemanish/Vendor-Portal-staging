<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Control Tower</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
  /* ================================
     WINDX SYSTEM SHELL (same as login)
     ================================ */

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 14px;
    color: #000;
    background-color: #E5E5E5;
  }

  #app-shell { height: 100%; }

  /* ---------- Title Bar ---------- */
  .windx-titlebar {
    border-top: 1px solid #000;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 50px;
    padding: 0 20px;
    background: #FFFFFF;
    font-size: 16px;
  }
  .title-left { justify-self: start; }
  .title-center { justify-self: center; font-weight: bold; }
  .title-right { justify-self: end; }

  /* ---------- System Shell ---------- */
  .system-shell {
    display: flex;
    height: calc(100vh - 50px);
    width: 100%;
  }

  /* ---------- Rails ---------- */
  .system-rail {
    width: 17px;
    background: #000;
    display: flex;
    justify-content: center;
  }
  .system-rail-line {
    width: 2px;
    background: #FFF;
    height: 100%;
  }

  /* ---------- Center ---------- */
  .system-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #E5E5E5;
  }

  .system-top-bar, .system-bottom-bar {
    height: 17px;
    background: #000;
    display: flex;
    align-items: center;
  }
  .system-top-line, .system-bottom-line {
    width: 100%;
    height: 2px;
    background: #FFF;
  }

  /* ---------- Workspace ---------- */
  .app-workspace {
    flex: 1 1 auto;
    background: #E5E5E5;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: stretch; /* allow full-height frame */
    padding: 22px 0;      /* breathing room like a desktop */
  }

  .workspace-frame {
    background: #F2F2F2;
    width: calc(100% - 120px);
    max-width: 1400px;
    margin: 0 auto;
    padding: 18px 18px;
    border: 1px solid #D0D0D0;
    min-height: 0;
    overflow: auto;
  }

  /* ================================
     WINDX-ish component styling
     ================================ */
  h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 14px 0;
  }

  .card {
    border-radius: 0;
    border: 1px solid #D0D0D0;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
  }

  .table {
    font-size: 13px;
  }

  .table thead th {
    background: #000 !important;
    color: #FFF !important;
    border-color: #000 !important;
    font-weight: 600;
  }

  /* KPI strip cards if you render bootstrap cards in JS */
  .kpi-card, .kpi {
    border-radius: 0 !important;
    border: 1px solid #D0D0D0 !important;
    background: #FFF;
  }

  /* Optional: tighten bootstrap spacing */
  .container-fluid.windx-inner {
    padding: 0;
  }
  </style>
</head>

<body>

<div id="app-shell">

  <!-- TITLE BAR -->
  <div class="windx-titlebar">
    <div class="title-left" id="sys-date"></div>
    <div class="title-center">Fort Garry Industries</div>
    <div class="title-right" id="sys-time"></div>
  </div>

  <div class="system-shell">

    <!-- LEFT RAIL -->
    <div class="system-rail">
      <div class="system-rail-line"></div>
    </div>

    <!-- CENTER -->
    <div class="system-center">

      <div class="system-top-bar">
        <div class="system-top-line"></div>
      </div>

      <!-- DASHBOARD WORKSPACE -->
      <div class="app-workspace">
        <div class="workspace-frame">

          <div class="container-fluid windx-inner">

            <h3 class="mb-3">Admin Control Tower</h3>

            <div class="d-flex gap-2 mb-3">
              <a class="btn btn-sm btn-outline-dark"
                href="{{ url_for('admin.admin_dashboard_page') }}">
                Admin Dashboard
              </a>

              <a class="btn btn-sm btn-outline-dark"
                href="{{ url_for('admin.admin_submissions_page') }}">
                Submission Control Tower
              </a>
            </div>

            <!-- KPI STRIP -->
            <div class="row g-3 mb-4" id="kpiStrip"></div>

            <!-- SCORE CHART -->
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title">Vendor Score Distribution</h5>
                <canvas id="scoreChart" height="80"></canvas>
              </div>
            </div>

            <!-- VENDOR TABLE -->
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Vendor Health Overview</h5>
                <div class="table-responsive">
                  <table class="table table-bordered table-hover" id="vendorTable">
                    <thead>
                      <tr>
                        <th>Vendor</th>
                        <th>Score</th>
                        <th>Completeness</th>
                        <th>Autofix</th>
                        <th>Errors</th>
                        <th>Deltas</th>
                        <th>Last Updated</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>

      <div class="system-bottom-bar">
        <div class="system-bottom-line"></div>
      </div>

    </div>

    <!-- RIGHT RAIL -->
    <div class="system-rail">
      <div class="system-rail-line"></div>
    </div>

  </div>
</div>

<script>
function updateSystemTime() {
  const now = new Date();
  document.getElementById("sys-date").textContent = now.toLocaleDateString();
  document.getElementById("sys-time").textContent = now.toLocaleTimeString();
}
updateSystemTime();
setInterval(updateSystemTime, 1000);
</script>

<script src="{{ url_for('static', filename='admin_dashboard.js') }}"></script>

</body>
</html>
