<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Control Tower</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container-fluid py-4">

  <h3 class="mb-4">Admin Control Tower</h3>

  <!-- KPI STRIP -->
  <div class="row g-3 mb-4" id="kpiStrip"></div>

  <!-- SCORE CHART -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Vendor Score Distribution</h5>
      <canvas id="scoreChart" height="80"></canvas>
    </div>
  </div>

  <!-- VENDOR TABLE -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Vendor Health Overview</h5>
      <div class="table-responsive">
        <table class="table table-bordered table-hover" id="vendorTable">
          <thead class="table-dark">
            <tr>
              <th>Vendor</th>
              <th>Score</th>
              <th>Completeness</th>
              <th>Autofix</th>
              <th>Errors</th>
              <th>Deltas</th>
              <th>Last Updated</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='admin_dashboard.js') }}"></script>

</body>
</html>
