<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Submission Control Tower</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
  /* ================================
     WINDX SYSTEM SHELL (same as login)
     ================================ */
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 14px;
    color: #000;
    background-color: #E5E5E5;
  }

  #app-shell { height: 100%; }

  .windx-titlebar {
    border-top: 1px solid #000;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 50px;
    padding: 0 20px;
    background: #FFFFFF;
    font-size: 16px;
  }

  .title-left { justify-self: start; }
  .title-center { justify-self: center; font-weight: bold; }
  .title-right { justify-self: end; }

  .system-shell {
    display: flex;
    height: calc(100vh - 50px);
    width: 100%;
  }

  .system-rail {
    width: 17px;
    background: #000;
    display: flex;
    justify-content: center;
  }

  .system-rail-line {
    width: 2px;
    background: #FFF;
    height: 100%;
  }

  .system-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #E5E5E5;
    min-width: 0;
  }

  .system-top-bar,
  .system-bottom-bar {
    height: 17px;
    background: #000;
    display: flex;
    align-items: center;
  }

  .system-top-line,
  .system-bottom-line {
    width: 100%;
    height: 2px;
    background: #FFF;
  }

  /* Workspace */
  .app-workspace {
    flex: 1 1 auto;
    background: #E5E5E5;
    min-height: 0;
    overflow: auto; /* dashboard can scroll */
    padding: 22px 0; /* breathing room */
  }

  .workspace-frame {
    background: #F2F2F2;
    width: calc(100% - 120px);
    max-width: 1600px;
    margin: 0 auto;
    border: 1px solid #D0D0D0;
    padding: 18px 18px;
  }

  /* ================================
     DASHBOARD STYLES (yours, kept)
     ================================ */
  .status-badge {
    font-size: 0.72rem;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 500;
    display: inline-block;
  }

  .status-success { background-color: #d4edda; color: #155724; }
  .status-failed { background-color: #f8d7da; color: #721c24; }
  .status-missing { background-color: #fff3cd; color: #856404; }
  .status-pending { background-color: #e2e3e5; color: #41464b; }
  .status-approved { background-color: #cfe2ff; color: #084298; }
  .status-generated { background-color: #e0cffc; color: #5a189a; }
  .status-processing { background-color: #ffe5d0; color: #7a2e00; }

  .stage-badge { font-size: 0.75rem; }

  /* Optional: slightly more WindX look */
  .card { border-radius: 0; }
  .card:hover { transform: translateY(-3px); transition: 0.2s ease; }

  .form-control, .form-select {
    font-size: 13px;
    border-radius: 0;
    background-color: #FFFFFF;
    border: 1px solid #7F9DB9;
    padding: 4px 6px;
  }

  .form-control:focus, .form-select:focus {
    outline: none;
    border-color: #003399;
    box-shadow: none;
  }

  /* Loading overlay should cover the whole app */
  #loadingOverlay {
    background: rgba(255,255,255,0.85);
    z-index: 9999;
    display: none;
  }
  </style>
</head>

<body>

<div id="app-shell">

  <!-- TITLE BAR -->
  <div class="windx-titlebar">
    <div class="title-left" id="sys-date"></div>
    <div class="title-center">Fort Garry Industries</div>
    <div class="title-right" id="sys-time"></div>
  </div>

  <div class="system-shell">

    <!-- LEFT RAIL -->
    <div class="system-rail">
      <div class="system-rail-line"></div>
    </div>

    <!-- CENTER -->
    <div class="system-center">

      <div class="system-top-bar">
        <div class="system-top-line"></div>
      </div>

      <!-- WORKSPACE -->
      <div class="app-workspace">

        <div class="workspace-frame">

          <!-- LOADING OVERLAY -->
          <div id="loadingOverlay"
               class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center">
            <div class="text-center">
              <div class="spinner-border text-primary mb-3" role="status"></div>
              <div id="loadingMessage" class="fw-semibold">Initializing...</div>
            </div>
          </div>

          <!-- YOUR ORIGINAL CONTENT (kept) -->
          <div class="container-fluid py-2">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h4 class="mb-0">Admin Submission Control Tower</h4>
                <div class="text-muted small">Monitor latest vendor state, with optional history.</div>
              </div>

              <div class="d-flex gap-2 align-items-center">
                <input type="text" id="searchVendor" class="form-control form-control-sm"
                      placeholder="Search vendor..." style="width:200px;">

                <select id="stageFilter" class="form-select form-select-sm" style="width:190px;">
                  <option value="">All Stages</option>
                  <option value="ready">Ready</option>
                  <option value="in_review">In Review</option>
                  <option value="post_pricing_review">Post Pricing</option>
                  <option value="ready_pricing_review">Ready Pricing Review</option>
                  <option value="category_queue">Category Queue</option>
                  <option value="approved">Approved</option>
                  <option value="rejected">Rejected</option>
                </select>

                <div class="form-check form-switch ms-2">
                  <input class="form-check-input" type="checkbox" id="latestOnly" checked>
                  <label class="form-check-label small" for="latestOnly">Latest only</label>
                </div>
              </div>
            </div>

            <!-- SUMMARY COUNTERS -->
            <div class="row g-3 mb-4" id="summaryCounters"></div>

            <!-- CARDS -->
            <div class="row g-3" id="submissionContainer"></div>

          </div>

        </div>
      </div>

      <div class="system-bottom-bar">
        <div class="system-bottom-line"></div>
      </div>

    </div>

    <!-- RIGHT RAIL -->
    <div class="system-rail">
      <div class="system-rail-line"></div>
    </div>

  </div>
</div>

<script>
function updateSystemTime() {
  const now = new Date();
  document.getElementById("sys-date").textContent = now.toLocaleDateString();
  document.getElementById("sys-time").textContent = now.toLocaleTimeString();
}
updateSystemTime();
setInterval(updateSystemTime, 1000);
</script>

<script>
let submissions = [];
let isLoading = false;

const loadingOverlay = document.getElementById("loadingOverlay");
const loadingMessage = document.getElementById("loadingMessage");

function buildApiUrl() {
  const latestOnly = document.getElementById("latestOnly").checked ? "1" : "0";
  return `/api/admin/submissions?latest_only=${latestOnly}`;
}

async function loadSubmissions() {

  showLoading("Connecting to control tower API...");

  try {
    const res = await fetch(buildApiUrl());
    submissions = await res.json();

    renderDashboard();

  } catch (err) {
    console.error(err);
  }

  // FORCE remove overlay no matter what
  document.getElementById("loadingOverlay").remove();
}

function showLoading(message) {
  if (!loadingOverlay) return;
  document.getElementById("loadingMessage").textContent = message;
  loadingOverlay.style.display = "flex";
}

function hideLoading() {
  if (!loadingOverlay) return;
  loadingOverlay.style.display = "none";
}

function updateLoading(message) {
  document.getElementById("loadingMessage").textContent = message;
}

function renderDashboard() {
  renderSummary();
  renderCards();
}

function renderSummary() {
  const container = document.getElementById("summaryCounters");

  const total = submissions.length;
  const count = (stage) => submissions.filter(s => s.stage === stage).length;

  const ready = count("ready");
  const inReview = count("in_review");
  const postPricing = count("post_pricing_review");
  const readyPricing = count("ready_pricing_review");
  const categoryQueue = count("category_queue");
  const approved = count("approved");
  const rejected = count("rejected");

  container.innerHTML = `
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Total</div>
        <div class="h4 mb-0">${total}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Ready</div>
        <div class="h4 mb-0">${ready}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">In Review</div>
        <div class="h4 mb-0">${inReview}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Post Pricing</div>
        <div class="h4 mb-0">${postPricing}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Category Queue</div>
        <div class="h4 mb-0">${categoryQueue}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Rejected</div>
        <div class="h4 mb-0 text-danger">${rejected}</div>
      </div>
    </div>

    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Ready Pricing</div>
        <div class="h4 mb-0">${readyPricing}</div>
      </div>
    </div>
    <div class="col-md-2">
      <div class="card shadow-sm p-3">
        <div class="text-muted small">Approved</div>
        <div class="h4 mb-0">${approved}</div>
      </div>
    </div>
  `;
}

function renderCards() {
  const container = document.getElementById("submissionContainer");
  container.innerHTML = "";

  const search = document.getElementById("searchVendor").value.toLowerCase();
  const stageFilter = document.getElementById("stageFilter").value;

  submissions
    .filter(s =>
      s.vendor.toLowerCase().includes(search) &&
      (stageFilter === "" || s.stage === stageFilter)
    )
    .forEach(sub => {
      const col = document.createElement("div");
      col.className = "col-md-6 col-lg-4";

      col.innerHTML = `
        <div class="card shadow-sm h-100">
          <div class="card-body">

            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="mb-0">${escapeHtml(sub.vendor)}</h6>
                <small class="text-muted">${escapeHtml(sub.submission_id)}</small>
              </div>
              <span class="badge bg-dark stage-badge">${escapeHtml(sub.stage).toUpperCase()}</span>
            </div>

            ${sub.failure ? `
              <div class="mt-2 text-danger small">
                ⚠ Failure: ${escapeHtml(sub.failure).toUpperCase()}
              </div>
            ` : ""}

            <hr class="my-3">

            <div class="d-flex flex-wrap gap-1">
              ${renderPipeline(sub.pipeline)}
            </div>

          </div>
        </div>
      `;

      container.appendChild(col);
    });
}

function renderPipeline(pipeline) {
  let html = "";
  Object.entries(pipeline).forEach(([step, status]) => {
    html += `
      <span class="status-badge status-${status}">
        ${capitalize(step)}
      </span>
    `;
  });
  return html;
}

function capitalize(text) {
  if (!text) return "";
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Events
document.getElementById("searchVendor").addEventListener("input", renderCards);
document.getElementById("stageFilter").addEventListener("change", renderCards);

document.getElementById("latestOnly").addEventListener("change", () => {
  loadSubmissions(); // refetch from API with latest_only toggled
});

// Initial load
hideLoading(); // force it hidden first
loadSubmissions();
</script>

</body>
</html>
