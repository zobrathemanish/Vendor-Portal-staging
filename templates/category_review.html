<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Category Work Queue</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='category_review.css') }}">
</head>
<body class="bg-light">

<div class="container-fluid py-3">

  <!-- HEADER -->
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="mb-0">Category Work Queue</h4>
      <div class="text-muted small">
        Items pending approval from all vendors
      </div>
    </div>

    <div class="d-flex gap-2">
      <span class="badge text-bg-dark" id="badge-vendors">vendors: 0</span>
      <span class="badge text-bg-secondary" id="badge-total">parts: 0</span>
      <span class="badge text-bg-warning" id="badge-pending">pending: 0</span>
      <span class="badge text-bg-success" id="badge-approved">approved: 0</span>
      <span class="badge text-bg-danger" id="badge-rejected">rejected: 0</span>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="card shadow-sm mb-3">
    <div class="card-body d-flex gap-2">
      <input class="form-control form-control-sm" id="search" placeholder="Search part number or vendor..." />
      <select class="form-select form-select-sm" id="filterDecision" style="max-width: 160px;">
        <option value="all">All</option>
        <option value="pending">Pending</option>
        <option value="approve">Approved</option>
        <option value="reject">Rejected</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Vendor</th>
            <th>Part Number</th>
            <th class="text-center">Insert</th>
            <th class="text-center">Update</th>
            <th class="text-center">Delete</th>
            <th>Status</th>
            <th style="width: 200px;">Actions</th>
          </tr>
        </thead>
        <tbody id="queueTable">
          <tr>
            <td colspan="7" class="text-center text-muted py-4">
              Loading queue...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ============================= -->
<!-- PRODUCT INTELLIGENCE MODAL  -->
<!-- ============================= -->

<div class="modal fade" id="partModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Product Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalBody">
        Loading...
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" id="modalApprove">Approve</button>
        <button class="btn btn-danger" id="modalReject">Reject</button>
        <button class="btn btn-outline-secondary" id="modalHold">Hold</button>
      </div>

    </div>
  </div>
</div>

<script>
  window.REVIEW_CTX = {};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='category_review.js') }}"></script>

</body>
</html>
